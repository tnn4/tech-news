name: Run Pipeline and Deploy

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. Download DB state from previous run (if present)
      - name: Download Previous DB Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: sqlite-db-artifact
          if_no_artifact_found: ignore

      # 2. Run pipeline (generates trends_data.json and updates hn_archive.db)
      - name: Run Analytics Pipeline
        run: python scripts/hn_analytics_pipeline.py

      # 3. Save DB as private artifact for next cron run
      - name: Upload DB Artifact for Next Run
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-db-artifact
          path: hn_archive.db
          retention-days: 90

      # 4. Package and publish directly to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
